    <path d="M20 9 C13.7 9 10 14 10 20.3 C10 26.6 15 31.6 21.3 31.6 C27.5 31.6 30 26.6 30 21.5 C30 15.3 25 11.5 20 11.5 C16.2 11.5 13.8 14 13.8 17.8 C13.8 22.2 17.5 24.7 21.3 24.7 C25 24.7 26.3 22.2 26.3 20.3" 
