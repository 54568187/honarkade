<!-- Cart Drawer (سبد خرید کشویی کناری) -->
<div id="cart-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden transition-opacity"></div>

<aside id="cart-drawer" class="fixed top-0 left-0 bottom-0 w-full sm:w-96 bg-[#FAF7F2] z-50 shadow-2xl flex flex-col transform -translate-x-full transition-transform duration-300 ease-in-out border-r border-[#E8E3D9]">
  
  <!-- سربرگ سبد خرید -->
  <div class="p-5 bg-white border-b border-[#E8E3D9] flex items-center justify-between">
    <div class="flex items-center gap-2">
      <h3 class="text-base font-bold text-[#1E3329]">سبد خرید شما</h3>
      <span class="text-xs text-[#82533D] bg-[#F7EFEA] px-2 py-0.5 rounded-full font-medium">۰ اثر</span>
    </div>
    <button id="close-cart-btn" type="button" class="p-2 text-[#6B726E] hover:text-[#1E3329] rounded-xl hover:bg-[#FAF7F2] transition-colors" title="بستن">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- لیست آیتم‌های سبد خرید (وضعیت خالی پیش‌فرض) -->
  <div class="flex-grow p-6 flex flex-col items-center justify-center text-center">
    <div class="w-16 h-16 rounded-2xl bg-[#E8EFEA] text-[#2C4A3E] flex items-center justify-center mb-4">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
      </svg>
    </div>
    <h4 class="text-sm font-bold text-[#1E3329] mb-1">سبد خرید شما خالی است</h4>
    <p class="text-xs text-[#6B726E] max-w-xs leading-relaxed mb-6">
      آثار هنری و دست‌سازه‌های مورد علاقه خود را از بخش گالری به سبد خرید اضافه کنید.
    </p>
    <a href="./shop.html" class="inline-flex items-center justify-center px-5 py-2.5 rounded-xl bg-[#2C4A3E] text-white text-xs font-semibold hover:bg-[#1E3329] transition-colors shadow-sm">
      مشاهده گالری آثار
    </a>
  </div>

  <!-- بخش پایین و نهایی کردن خرید -->
  <div class="p-5 bg-white border-t border-[#E8E3D9] space-y-3">
    <div class="flex items-center justify-between text-sm">
      <span class="text-[#6B726E]">جمع کل سفارش:</span>
      <span class="font-bold text-[#1E3329]">۱,۴۵۰,۰۰۰ تومان</span>
    </div>
    <a href="./cart.html" class="block text-center w-full py-3 rounded-xl bg-[#2C4A3E] hover:bg-[#1E3329] text-white text-sm font-bold transition-all shadow-sm">
      مشاهده و تسویه سبد خرید
    </a>
  </div>

</aside>
