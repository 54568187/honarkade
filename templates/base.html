<!DOCTYPE html>
<html lang="{{ current_lang|default:'fa' }}" dir="{{ site_dir|default:'rtl' }}" class="{% if is_en %}en-layout{% else %}fa-layout{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>{% block title %}{{ site_settings.title|default:"هنرکده | گالری و فروشگاه آنلاین آثار هنری و دست‌سازه‌ها" }}{% endblock %}</title>
  
  <meta name="description" content="{% block meta_description %}{{ site_settings.description|default:'خرید و فروش آنلاین آثار اصیل هنری، نقاشی، خوشنویسی، سرامیک و دست‌سازه‌ها' }}{% endblock %}">

  <!-- 
    ★ قابلیت تغییر فاوآیکون از دیتابیس در جنگو:
    در صورت وجود مدل تنظیمات در دیتابیس (site_settings.favicon.url)، از آن استفاده می‌شود؛
    در غیر این صورت از فایل پیش‌فرض باکیفیت static استفاده خواهد شد.
  -->
  <link rel="icon" type="image/svg+xml" href="{% if site_settings and site_settings.favicon %}{{ site_settings.favicon.url }}{% else %}/static/images/favicon.svg{% endif %}">

  <!-- استایل‌های بیلد شده تیلویند به همراه فونت‌های محلی بدون نیاز به اینترنت -->
  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    /* کلاس کمکی مخفی‌سازی اسکرول‌بار در اسکرول‌های افقی لمسی موبایل */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ارتفاع ریسپانسیو اسلایدر صفحه اصلی در کلیه ابعاد */
    #hero-slider-container {
      height: 360px;
      min-height: 360px;
      position: relative;
    }
    @media (min-width: 640px) {
      #hero-slider-container {
        height: 460px;
        min-height: 460px;
      }
    }
    @media (min-width: 1024px) {
      #hero-slider-container {
        height: 520px;
        min-height: 520px;
      }
    }

    /* مکان ثابت و دقیق دکمه‌های کنترل قبلی/بعدی در دو سمت اسلایدر */
    #slider-prev {
      position: absolute !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      right: 20px !important;
      left: auto !important;
      z-index: 30 !important;
    }
    #slider-next {
      position: absolute !important;
      top: 50% !important;
      transform: translateY(-50%) !important;
      left: 20px !important;
      right: auto !important;
      z-index: 30 !important;
    }
    @media (max-width: 640px) {
      #slider-prev {
        right: 10px !important;
        width: 36px !important;
        height: 36px !important;
      }
      #slider-next {
        left: 10px !important;
        width: 36px !important;
        height: 36px !important;
      }
    }
    @media (min-width: 641px) {
      #slider-prev {
        right: 24px !important;
        width: 48px !important;
        height: 48px !important;
      }
      #slider-next {
        left: 24px !important;
        width: 48px !important;
        height: 48px !important;
      }
    }
    .slider-dots-box {
      position: absolute !important;
      bottom: 20px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      z-index: 30 !important;
    }

    /* استایل‌های جامع جهت چیدمان انگلیسی و چپ‌چین کامل قالب و محتوا (LTR Mode) */
    html[dir="ltr"],
    html[dir="ltr"] body {
      direction: ltr !important;
      text-align: left !important;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
    }
    html[dir="ltr"] .text-right {
      text-align: left !important;
    }
    html[dir="ltr"] input,
    html[dir="ltr"] textarea,
    html[dir="ltr"] select {
      text-align: left !important;
      direction: ltr !important;
    }
    html[dir="ltr"] #slider-prev {
      left: 20px !important;
      right: auto !important;
    }
    html[dir="ltr"] #slider-next {
      right: 20px !important;
      left: auto !important;
    }
    @media (max-width: 640px) {
      html[dir="ltr"] #slider-prev {
        left: 10px !important;
        right: auto !important;
      }
      html[dir="ltr"] #slider-next {
        right: 10px !important;
        left: auto !important;
      }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-[#FAF7F2] text-[#242826] min-h-screen flex flex-col {% if is_en %}font-sans{% else %}font-['Vazirmatn']{% endif %} selection:bg-[#2C4A3E] selection:text-[#FAF7F2] antialiased overflow-x-hidden">

  <!-- نوبار و هدر سایت -->
  {% include 'components/navbar.html' %}

  <!-- پیام‌ها و اعلانات سیستم جنگو -->
  {% if messages %}
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-3 w-full">
    {% for message in messages %}
    <div class="p-3.5 mb-2 rounded-2xl text-xs sm:text-sm font-bold flex items-center justify-between shadow-sm {% if message.tags == 'error' %}bg-rose-100 text-rose-800 border border-rose-200{% elif message.tags == 'success' %}bg-emerald-100 text-emerald-800 border border-emerald-200{% else %}bg-blue-100 text-blue-800 border border-blue-200{% endif %}">
      <span>{{ message }}</span>
      <button onclick="this.parentElement.remove()" class="text-sm font-bold px-2 py-0.5 opacity-70 hover:opacity-100 cursor-pointer">✕</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}

  <!-- محتوای اصلی صفحات -->
  <main class="flex-grow">
    {% block content %}
    {% endblock %}
  </main>

  <!-- فوتر سایت -->
  {% include 'components/footer.html' %}

  <!-- اسکریپت‌های تعاملی -->
  <script src="/static/js/main.js"></script>
  <script>
    function toggleSiteLang() {
      const current = "{{ current_lang|default:'fa' }}";
      const next = current === 'fa' ? 'en' : 'fa';
      document.cookie = `site_lang=${next};path=/;max-age=31536000;SameSite=Lax`;
      localStorage.setItem('site_lang', next);
      const url = new URL(window.location.href);
      url.searchParams.set('lang', next);
      window.location.href = url.toString();
    }
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
