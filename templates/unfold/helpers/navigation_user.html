{% load unfold i18n %}

<div class="mt-auto border-t border-slate-700/60 p-3 space-y-2">
    <!-- جعبه پروفایل مدیر -->
    <div class="flex items-center gap-3 p-2.5 rounded-xl bg-slate-800/60 border border-slate-700/50">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-500 to-cyan-500 flex items-center justify-center text-white font-bold text-sm shadow-md">
            {{ request.user.username|slice:":1"|upper }}
        </div>
        <div class="flex flex-col min-w-0">
            <span class="text-xs font-bold text-white truncate">
                {{ request.user.get_full_name|default:request.user.username }}
            </span>
            <span class="text-[10px] text-teal-400 font-medium">مدیر ارشد سامانه</span>
        </div>
    </div>

    <!-- پیوندهای اختصاصی پایین سایدبار (مشابه تصویر ۴) -->
    <div class="pt-1 flex flex-col gap-1 text-xs">
        <a href="/" target="_blank" class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800/80 transition-all font-medium">
            <span class="material-symbols-outlined text-base text-cyan-400">language</span>
            <span>مشاهده وب‌سایت هنرکده</span>
            <span class="material-symbols-outlined text-xs mr-auto text-slate-500">open_in_new</span>
        </a>

        <a href="{% url 'admin:logout' %}" class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-rose-300 hover:text-rose-200 hover:bg-rose-950/40 transition-all font-medium">
            <span class="material-symbols-outlined text-base text-rose-400">logout</span>
            <span>خروج از حساب کاربری</span>
        </a>
    </div>
</div>
